name: EventSlot Staging CI & Code Checks (Legacy Deploy Decommissioned)

# NOTE: Direct deployment to Cloud Run via GitHub Actions has been decommissioned.
# Staging deployments are exclusively executed via Google Cloud Build using `cloudbuild.staging.yaml`
# to ensure:
# 1. Pinned Prisma migrations execute in a dedicated, isolated pre-deploy step against EVENTSLOT_STAGING_DATABASE_URL.
# 2. Production database credentials are never exposed to staging services.
# 3. Cloud Run application instances default to RUN_DB_MIGRATIONS=false.

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: eventslot-web-staging
  REPOSITORY: eventslot
  STAGING_URL: https://staging.eventsslot.com
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Tests & Code Checks (Staging)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: https://staging.eventsslot.com
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  deploy:
    name: Deploy to Cloud Run (Staging) — DECOMMISSIONED
    runs-on: ubuntu-latest
    needs: test
    if: false # PERMANENTLY DISABLED: Staging deployments are exclusively executed via Google Cloud Build (cloudbuild.staging.yaml)

    steps:
      - name: Staging Deploy Disabled Notice
        run: |
          echo "ERROR: Direct deployment to Cloud Run via GitHub Actions has been decommissioned."
          echo "Staging deployments must be triggered via Google Cloud Build using 'cloudbuild.staging.yaml'."
          echo "This enforces decoupled pre-deploy migrations against EVENTSLOT_STAGING_DATABASE_URL and prevents production database cross-contamination."
          exit 1
