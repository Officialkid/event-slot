name: Isolated PostgreSQL Concurrency Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-concurrency:
    name: PostgreSQL Concurrency & Row Lock Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_ci_password
          POSTGRES_DB: eventslot_test_concurrency
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test_ci_password@localhost:5432/eventslot_test_concurrency?schema=public
      TEST_POSTGRES_DATABASE_URL: postgresql://postgres:test_ci_password@localhost:5432/eventslot_test_concurrency?schema=public
      NEXTAUTH_SECRET: ci-test-secret-value-32-chars-long
      NEXTAUTH_URL: http://localhost:3000
      PAYSTACK_SECRET_KEY: sk_test_ci_mock_secret_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Prisma Schema to Disposable PostgreSQL Container
        run: npx prisma db push --skip-generate

      - name: Execute Real PostgreSQL Concurrency Test Suite
        run: npm test -- __tests__/integration/postgresConcurrencyPhase52.test.ts
