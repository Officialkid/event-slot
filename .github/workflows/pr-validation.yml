name: PR Validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:

  # ── Check PR title follows convention ────────────────────────────────
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            build
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must not start with an uppercase letter.
            Example valid titles:
              feat: add countdown timer to registration page
              fix: resolve timer not rendering on client
              chore: update dependencies

  # ── Check no console.log left in code ────────────────────────────────
  no-console:
    name: No console.log in production code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for console.log statements
        run: |
          # Allow console.error and console.warn — only block console.log
          if grep -rn "console\.log(" --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=.git \
            .; then
            echo "❌ console.log() found in source files."
            echo "Replace with console.error() for errors or remove entirely."
            exit 1
          else
            echo "✅ No console.log() found."
          fi

  # ── Check for missing env var references ─────────────────────────────
  env-check:
    name: Environment Variable Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .env.example is up to date
        run: |
          if [ ! -f .env.example ]; then
            echo "⚠️  .env.example file missing — create it so new developers can onboard easily"
          else
            echo "✅ .env.example exists"
          fi

  # ── Check Prisma schema is valid ──────────────────────────────────────
  prisma-validate:
    name: Validate Prisma Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

  # ── Full build check on PR ────────────────────────────────────────────
  build-check:
    name: Build Check (PR)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXTAUTH_URL: https://www.eventsslot.com
          NEXTAUTH_SECRET: ci-build-secret
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          RESEND_API_KEY: ci-resend-api-key
          PAYSTACK_SECRET_KEY: ci-paystack-secret-key
          PAYSTACK_PUBLIC_KEY: ci-paystack-public-key
          ANTHROPIC_API_KEY: ci-anthropic-api-key
          UPSTASH_REDIS_REST_URL: https://ci-upstash.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-upstash-token
          SUPER_ADMIN_EMAIL: ci@eventsslot.com
          R2_ACCOUNT_ID: ci-r2-account-id
          R2_ACCESS_KEY_ID: ci-r2-access-key-id
          R2_SECRET_ACCESS_KEY: ci-r2-secret-access-key
          R2_BUCKET_NAME: ci-bucket
          R2_PUBLIC_URL: https://ci-r2.example.com
          CRON_SECRET: ci-cron-secret

      - name: Comment build result on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const icon = status === 'success' ? '✅' : '❌';
            const message = status === 'success'
              ? '✅ **Build passed.** This PR is safe to review and merge.'
              : '❌ **Build failed.** Fix the errors above before this PR can be merged.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
