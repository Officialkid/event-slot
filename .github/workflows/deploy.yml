name: EventSlot CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  PROJECT_ID: dotted-spot-476513-i2
  REGION: us-central1
  SERVICE: eventslot-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Tests & Code Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: https://www.eventsslot.com
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: https://www.eventsslot.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Normalize GCP service account secret
        id: gcp-key
        shell: bash
        env:
          RAW_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if echo "$RAW_GCP_SA_KEY" | jq -e . >/dev/null 2>&1; then
            CREDENTIALS_JSON="$RAW_GCP_SA_KEY"
          else
            DECODED="$(echo "$RAW_GCP_SA_KEY" | base64 -d 2>/dev/null || true)"
            if [ -z "$DECODED" ] || ! echo "$DECODED" | jq -e . >/dev/null 2>&1; then
              echo "GCP_SA_KEY must be valid JSON or base64-encoded JSON."
              exit 1
            fi
            CREDENTIALS_JSON="$DECODED"
          fi
          echo "::add-mask::$CREDENTIALS_JSON"
          {
            echo "credentials_json<<EOF"
            echo "$CREDENTIALS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ steps.gcp-key.outputs.credentials_json }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=cloudbuild.yaml \
            --substitutions="_IMAGE_TAG=${{ github.sha }}" \
            .

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.eventsslot.com)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: got HTTP $STATUS"
            exit 1
          fi
          echo "Deployment verified: HTTP $STATUS"
