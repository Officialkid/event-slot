name: EventSlot CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  PROJECT_ID: dotted-spot-476513-i2
  REGION: us-central1
  SERVICE: eventslot-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Tests & Code Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: https://www.eventsslot.com
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: https://www.eventsslot.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Normalize GCP service account secret
        id: gcp-key
        shell: bash
        env:
          RAW_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${RAW_GCP_SA_KEY:-}" ]; then
            echo "GCP_SA_KEY is empty. Add a valid Google service account JSON key in repository secrets."
            exit 1
          fi

          validate_key_json() {
            echo "$1" | jq -e 'type == "object" and has("client_email") and has("private_key")' >/dev/null 2>&1
          }

          normalize_candidate() {
            local v="$1"

            # Trim outer whitespace/newlines and strip accidental wrapping quotes.
            v="$(echo "$v" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"

            # Remove optional markdown code fences.
            v="$(printf '%s' "$v" | sed -e '/^```[[:alnum:]_-]*$/d' -e '/^```$/d')"

            # Handle secrets pasted as KEY=VALUE or export KEY=VALUE.
            if [[ "$v" == *=* ]]; then
              local k="${v%%=*}"
              local r="${v#*=}"
              k="$(printf '%s' "$k" | sed -E 's/^[[:space:]]*export[[:space:]]+//' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
              if [[ "$k" == *GCP_SA_KEY ]]; then
                r="$(printf '%s' "$r" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
                v="$r"
              fi
            fi

            # If extra text is present, keep widest JSON object slice.
            if printf '%s' "$v" | grep -q '{' && printf '%s' "$v" | grep -q '}'; then
              local json_slice
              json_slice="$(printf '%s' "$v" | awk '
                BEGIN { started=0 }
                {
                  if (!started) {
                    p = index($0, "{")
                    if (p > 0) {
                      started = 1
                      line = substr($0, p)
                    }
                  } else {
                    line = $0
                  }
                  if (started) out = out (out ? ORS : "") line
                }
                END {
                  if (out != "") {
                    while (length(out) > 0 && substr(out, length(out), 1) != "}") out = substr(out, 1, length(out)-1)
                    print out
                  }
                }
              ')"
              if [ -n "$json_slice" ]; then
                v="$json_slice"
              fi
            fi

            printf '%s' "$v"
          }

          try_extract_json() {
            local candidate unescaped decoded b64compact b64url

            try_json_forms() {
              local c p pp

              c="$1"
              if [ -n "$c" ] && validate_key_json "$c"; then
                printf '%s' "$c"
                return 0
              fi

              p="$(printf '%s' "$c" | jq -r 'fromjson? // empty' 2>/dev/null || true)"
              if [ -n "$p" ] && validate_key_json "$p"; then
                printf '%s' "$p"
                return 0
              fi

              pp="$(printf '%s' "$p" | jq -r 'fromjson? // empty' 2>/dev/null || true)"
              if [ -n "$pp" ] && validate_key_json "$pp"; then
                printf '%s' "$pp"
                return 0
              fi

              return 1
            }

            candidate="$(normalize_candidate "$1")"

            if decoded="$(try_json_forms "$candidate")"; then
              printf '%s' "$decoded"
              return 0
            fi

            unescaped="$(printf '%b' "${candidate//\\n/\n}" 2>/dev/null || true)"
            if decoded="$(try_json_forms "$unescaped")"; then
              printf '%s' "$decoded"
              return 0
            fi

            b64compact="$(printf '%s' "$candidate" | tr -d '\r\n\t ' | tr -cd 'A-Za-z0-9+/=_-')"

            decoded="$(printf '%s' "$b64compact" | base64 -d 2>/dev/null || true)"
            if decoded="$(try_json_forms "$decoded")"; then
              printf '%s' "$decoded"
              return 0
            fi

            b64url="$(printf '%s' "$b64compact" | tr '_-' '/+')"
            case $(( ${#b64url} % 4 )) in
              2) b64url="${b64url}==" ;;
              3) b64url="${b64url}=" ;;
            esac
            decoded="$(printf '%s' "$b64url" | base64 -d 2>/dev/null || true)"
            if decoded="$(try_json_forms "$decoded")"; then
              printf '%s' "$decoded"
              return 0
            fi

            return 1
          }

          CREDENTIALS_JSON="$(try_extract_json "$RAW_GCP_SA_KEY")" || true

          if [ -z "$CREDENTIALS_JSON" ]; then
            echo "GCP_SA_KEY could not be parsed. Supported formats: raw JSON, escaped JSON string, base64 JSON, base64url JSON."
            exit 1
          fi

          echo "::add-mask::$CREDENTIALS_JSON"
          {
            echo "credentials_json<<EOF"
            echo "$CREDENTIALS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ steps.gcp-key.outputs.credentials_json }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=cloudbuild.yaml \
            --substitutions="_IMAGE_TAG=${{ github.sha }}" \
            .

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.eventsslot.com)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: got HTTP $STATUS"
            exit 1
          fi
          echo "Deployment verified: HTTP $STATUS"
