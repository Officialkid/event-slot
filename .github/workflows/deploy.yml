name: EventSlot CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'dotted-spot-476513-i2' }}
  REGION: us-central1
  SERVICE: eventslot-web
  REPOSITORY: eventslot

jobs:
  checks:
    name: Code Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: https://www.eventsslot.com
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          NEXT_PUBLIC_APP_URL: https://www.eventsslot.com

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: https://eventslot-web-y6t3xsonxa-uc.a.run.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy with Cloud Build
        run: |
          gcloud config set project "$PROJECT_ID"
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions=_SERVICE=$SERVICE,_REGION=$REGION,_REPOSITORY=$REPOSITORY,_IMAGE_TAG=github-${GITHUB_SHA::12}

      - name: Show Cloud Run URL
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format="value(status.url)")
          echo "Cloud Run URL: $URL"

      - name: Notify deployment success
        if: success()
        run: echo "Deployed successfully to Cloud Run"

      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment failed - check GitHub Actions logs"
