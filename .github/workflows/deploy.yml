name: EventSlot CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  PROJECT_ID: eventslot
  REGION: us-central1
  SERVICE: eventslot-web
  REPOSITORY: eventslot

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Tests & Code Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: https://www.eventsslot.com
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}

    permissions:
      contents: write
      id-token: write

    environment:
      name: production
      url: https://www.eventsslot.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check deploy credentials
        id: deploy-ready
        shell: bash
        env:
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
          RAW_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${GCP_SA_KEY_B64:-}" ] || [ -n "${RAW_GCP_SA_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials detected."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No deploy credentials found. Deploy steps will be skipped; tests already ran in test job."
          fi

      - name: Normalize GCP service account secret
        if: steps.deploy-ready.outputs.enabled == 'true'
        id: gcp-key
        shell: bash
        env:
          GCP_SA_KEY_B64: ${{ secrets.GCP_SA_KEY_B64 }}
          RAW_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail

          validate_key_json() {
            echo "$1" | jq -e 'type == "object" and has("client_email") and has("private_key") and .type == "service_account"' >/dev/null 2>&1
          }

          # Preferred deterministic format: base64-encoded service account JSON in GCP_SA_KEY_B64.
          if [ -n "${GCP_SA_KEY_B64:-}" ]; then
            B64_CLEAN="$(printf '%s' "$GCP_SA_KEY_B64" | tr -d '\r\n\t ')"
            CREDENTIALS_JSON="$(printf '%s' "$B64_CLEAN" | base64 -d 2>/dev/null || true)"
            if [ -n "$CREDENTIALS_JSON" ] && validate_key_json "$CREDENTIALS_JSON"; then
              echo "::add-mask::$CREDENTIALS_JSON"
              {
                echo "credentials_json<<EOF"
                echo "$CREDENTIALS_JSON"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "GCP_SA_KEY_B64 is set but invalid."
            if [ -z "${RAW_GCP_SA_KEY:-}" ]; then
              echo "Save base64 output of the raw service-account JSON file in GCP_SA_KEY_B64 or set GCP_SA_KEY."
              exit 1
            fi
            echo "Falling back to GCP_SA_KEY secret."
          fi

          if [ -z "${RAW_GCP_SA_KEY:-}" ]; then
            echo "No auth secret found. Set GCP_SA_KEY_B64 (preferred) or GCP_SA_KEY in repository secrets."
            exit 1
          fi

          # First try direct raw JSON (the normal format for GCP_SA_KEY).
          RAW_TRIMMED="$(printf '%s' "$RAW_GCP_SA_KEY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if validate_key_json "$RAW_TRIMMED"; then
            CREDENTIALS_JSON="$RAW_TRIMMED"
          else
            # Also accept a JSON string that wraps the service account object.
            CREDENTIALS_JSON="$(printf '%s' "$RAW_TRIMMED" | jq -r 'fromjson? // empty' 2>/dev/null || true)"
          fi

          if [ -z "${CREDENTIALS_JSON:-}" ] || ! validate_key_json "$CREDENTIALS_JSON"; then
            echo "GCP_SA_KEY could not be parsed. Use GCP_SA_KEY_B64 instead for deterministic parsing."
            exit 1
          fi

          echo "::add-mask::$CREDENTIALS_JSON"
          {
            echo "credentials_json<<EOF"
            echo "$CREDENTIALS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate normalized GCP credentials
        if: steps.deploy-ready.outputs.enabled == 'true'
        shell: bash
        env:
          CREDENTIALS_JSON: ${{ steps.gcp-key.outputs.credentials_json }}
        run: |
          set -euo pipefail
          [ -n "${CREDENTIALS_JSON:-}" ] || { echo "Missing normalized credentials_json output"; exit 1; }
          printf '%s' "$CREDENTIALS_JSON" | jq -e 'type == "object" and .type == "service_account" and has("client_email") and has("private_key")' >/dev/null
          echo "Normalized GCP credentials validated."

      - name: Verify credentials project matches deploy project
        if: steps.deploy-ready.outputs.enabled == 'true'
        shell: bash
        env:
          CREDENTIALS_JSON: ${{ steps.gcp-key.outputs.credentials_json }}
          EXPECTED_PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          set -euo pipefail
          KEY_PROJECT_ID="$(printf '%s' "$CREDENTIALS_JSON" | jq -r '.project_id // empty')"
          if [ -z "$KEY_PROJECT_ID" ]; then
            echo "GCP key JSON does not include project_id."
            exit 1
          fi
          if [ "$KEY_PROJECT_ID" != "$EXPECTED_PROJECT_ID" ]; then
            echo "Refusing deploy: key project_id '$KEY_PROJECT_ID' does not match PROJECT_ID '$EXPECTED_PROJECT_ID'."
            exit 1
          fi
          echo "Credentials project matches deploy project: $KEY_PROJECT_ID"

      - name: Authenticate to Google Cloud
        if: steps.deploy-ready.outputs.enabled == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ steps.gcp-key.outputs.credentials_json }}

      - name: Set up Cloud SDK
        if: steps.deploy-ready.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Validate OAuth secrets (no hidden characters)
        if: steps.deploy-ready.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          validate_secret() {
            local secret_name=$1
            local tmpfile
            tmpfile=$(mktemp)

            # Use --out-file to get raw binary bytes — avoids bash stripping null bytes via $()
            if ! gcloud secrets versions access latest \
                --secret="$secret_name" \
                --project="$PROJECT_ID" \
                --out-file="$tmpfile" 2>/dev/null; then
              echo "❌ Error: Secret '$secret_name' not found in GCP Secret Manager."
              rm -f "$tmpfile"
              return 1
            fi

            if [ ! -s "$tmpfile" ]; then
              echo "❌ Error: Secret '$secret_name' is empty."
              rm -f "$tmpfile"
              return 1
            fi

            local hex_dump
            hex_dump=$(od -An -tx1 "$tmpfile" | tr -d ' \n')

            # Check for null bytes (00 in hex dump)
            if echo "$hex_dump" | grep -qE '(^|[0-9a-f]{2})00'; then
              echo "❌ Error: Secret '$secret_name' contains null bytes."
              rm -f "$tmpfile"
              return 1
            fi

            # Check for UTF-8 BOM (starts with efbbbf)
            if echo "$hex_dump" | grep -q '^efbbbf'; then
              echo "❌ Error: Secret '$secret_name' contains UTF-8 BOM."
              rm -f "$tmpfile"
              return 1
            fi

            # Check first byte for leading whitespace or line endings (20=space, 09=tab, 0a=LF, 0d=CR)
            local first_byte="${hex_dump:0:2}"
            if [[ "$first_byte" =~ ^(20|09|0a|0d)$ ]]; then
              echo "❌ Error: Secret '$secret_name' has leading whitespace or line ending."
              rm -f "$tmpfile"
              return 1
            fi

            # Check last byte for trailing whitespace or line endings
            local last_byte="${hex_dump: -2}"
            if [[ "$last_byte" =~ ^(20|09|0a|0d)$ ]]; then
              echo "❌ Error: Secret '$secret_name' has trailing whitespace or line ending."
              rm -f "$tmpfile"
              return 1
            fi

            rm -f "$tmpfile"
            echo "✓ Secret '$secret_name' validation passed (clean value)."
            return 0
          }

          # Validate both OAuth secrets
          all_valid=true
          validate_secret "EVENTSLOT_GOOGLE_CLIENT_ID" || all_valid=false
          validate_secret "EVENTSLOT_GOOGLE_CLIENT_SECRET" || all_valid=false

          if [ "$all_valid" = false ]; then
            echo ""
            echo "OAuth secrets validation failed. Please fix corrupted secrets in GCP Secret Manager."
            exit 1
          fi

          echo ""
          echo "All OAuth secrets passed validation ✓"

      - name: Configure Artifact Registry auth
        if: steps.deploy-ready.outputs.enabled == 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        if: steps.deploy-ready.outputs.enabled == 'true'
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
        run: |
          docker build -f Dockerfile -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run (no traffic)
        if: steps.deploy-ready.outputs.enabled == 'true'
        id: cloud-run-deploy
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --image="$IMAGE_URI" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --no-traffic \
            --set-env-vars=NEXTAUTH_URL_INTERNAL=http://localhost:3000 \
            --update-secrets=DATABASE_URL=EVENTSLOT_DATABASE_URL:latest,DIRECT_URL=EVENTSLOT_DIRECT_URL:latest,NEXTAUTH_SECRET=NEXTAUTH_SECRET:latest,NEXTAUTH_URL=EVENTSLOT_NEXTAUTH_URL:latest,GOOGLE_CLIENT_ID=EVENTSLOT_GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=EVENTSLOT_GOOGLE_CLIENT_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,CRON_SECRET=CRON_SECRET:latest,R2_ACCOUNT_ID=CLOUDFLARE_R2_ACCOUNT_ID:latest,R2_ACCESS_KEY_ID=CLOUDFLARE_R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=CLOUDFLARE_R2_SECRET_ACCESS_KEY:latest,R2_BUCKET_NAME=CLOUDFLARE_R2_BUCKET_NAME:latest,SUPER_ADMIN_EMAIL=SUPER_ADMIN_EMAIL:latest,SUPER_ADMIN_EMAIL_2=SUPER_ADMIN_EMAIL_2:latest,PAYSTACK_SECRET_KEY=PAYSTACK_SECRET_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,R2_PUBLIC_URL=CLOUDFLARE_R2_PUBLIC_URL:latest

          # Capture the new revision name for health check and traffic promotion
          NEW_REVISION=$(gcloud run revisions list \
            --service="$SERVICE" \
            --region="$REGION" \
            --project="$PROJECT_ID" \
            --format="value(name)" \
            --limit=1)
          echo "new_revision=$NEW_REVISION" >> "$GITHUB_OUTPUT"
          echo "New revision deployed (no traffic): $NEW_REVISION"

      - name: Health-check new revision before promoting traffic
        if: steps.deploy-ready.outputs.enabled == 'true'
        env:
          NEW_REVISION: ${{ steps.cloud-run-deploy.outputs.new_revision }}
        run: |
          set -euo pipefail

          # Get the URL of the specific new revision (Cloud Run serves revisions via a tagged URL)
          REVISION_URL=$(gcloud run revisions describe "$NEW_REVISION" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format="value(status.url)" 2>/dev/null || true)

          # Fall back to the service URL if revision URL isn't available (older gcloud versions)
          if [ -z "$REVISION_URL" ]; then
            REVISION_URL=$(gcloud run services describe "$SERVICE" \
              --project="$PROJECT_ID" \
              --region="$REGION" \
              --format="value(status.url)")
          fi

          echo "Health-checking new revision at: $REVISION_URL/api/health"
          MAX_ATTEMPTS=12
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "x-cloud-run-revision: $NEW_REVISION" \
              "$REVISION_URL/api/health" || echo "000")
            echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed on attempt $ATTEMPT."
              exit 0
            fi
            sleep 10
          done

          echo "Health check failed after $MAX_ATTEMPTS attempts. Traffic will NOT be promoted."
          echo "Users continue on the previous working revision."
          exit 1

      - name: Promote traffic to new revision
        if: steps.deploy-ready.outputs.enabled == 'true'
        env:
          NEW_REVISION: ${{ steps.cloud-run-deploy.outputs.new_revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-revisions="$NEW_REVISION=100"
          echo "Traffic 100% promoted to $NEW_REVISION"

      - name: Verify deployment
        if: steps.deploy-ready.outputs.enabled == 'true'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.eventsslot.com)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: got HTTP $STATUS"
            exit 1
          fi
          echo "Deployment verified: HTTP $STATUS"

      - name: Capture deploy metadata
        if: steps.deploy-ready.outputs.enabled == 'true'
        id: deploy-meta
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          REVISION="$(gcloud run revisions list --service="$SERVICE" --region="$REGION" --format="value(name)" --limit=1)"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "revision=${REVISION:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Update canonical system documentation
        if: steps.deploy-ready.outputs.enabled == 'true'
        env:
          DOC_UPDATED_AT: ${{ steps.deploy-meta.outputs.date }}
          DOC_COMMIT_SHA: ${{ github.sha }}
          DOC_CLOUD_RUN_REVISION: ${{ steps.deploy-meta.outputs.revision }}
          DOC_CHANGE_DESCRIPTION: Auto-deploy metadata update
        run: node scripts/update-system-docs.mjs

      - name: Commit documentation metadata
        if: steps.deploy-ready.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/EVENTSLOT_SYSTEM_DOCUMENTATION.md
          if git diff --cached --quiet; then
            echo "No documentation updates to commit."
            exit 0
          fi

          git commit -m "docs(auto): update deploy metadata [skip ci]"

          # Another workflow may push to main at the same time.
          # Rebase and retry so this docs commit is not lost on non-fast-forward.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "Documentation metadata pushed successfully on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort || true
            sleep 2
          done

          echo "Failed to push documentation metadata after 3 attempts."
          exit 1

      - name: Build and push docs-site image
        if: steps.deploy-ready.outputs.enabled == 'true'
        env:
          DOCS_IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eventslot-docs:${{ github.sha }}
        run: |
          docker build -f Dockerfile.docs -t "$DOCS_IMAGE_URI" .
          docker push "$DOCS_IMAGE_URI"

      - name: Deploy documentation site to Cloud Run
        if: steps.deploy-ready.outputs.enabled == 'true'
        env:
          DOCS_IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/eventslot-docs:${{ github.sha }}
          DOCS_SERVICE: eventslot-docs
        run: |
          gcloud run deploy "$DOCS_SERVICE" \
            --project="$PROJECT_ID" \
            --image="$DOCS_IMAGE_URI" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=3000 \
            --set-env-vars=NEXT_TELEMETRY_DISABLED=1,NODE_ENV=production \
            --min-instances=1 \
            --max-instances=5

      - name: Verify documentation deployment
        if: steps.deploy-ready.outputs.enabled == 'true'
        run: |
          DOCS_URL=$(gcloud run services describe eventslot-docs --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          echo "Documentation site deployed at: $DOCS_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DOCS_URL")
          if [ "$STATUS" != "200" ]; then
            echo "Docs smoke test failed: got HTTP $STATUS"
            exit 1
          fi
          echo "Documentation deployment verified: HTTP $STATUS"

      - name: Deploy skipped (credentials missing)
        if: steps.deploy-ready.outputs.enabled != 'true'
        run: echo "Skipping deploy. Set GCP_SA_KEY_B64 to enable Cloud Run deployment."
