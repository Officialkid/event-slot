name: EventSlot CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  PROJECT_ID: dotted-spot-476513-i2
  REGION: us-central1
  SERVICE: eventslot-web
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Tests & Code Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: https://www.eventsslot.com
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    environment:
      name: production
      url: https://www.eventsslot.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Normalize GCP service account secret
        id: gcp-key
        shell: bash
        env:
          RAW_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${RAW_GCP_SA_KEY:-}" ]; then
            echo "GCP_SA_KEY is empty. Add a valid Google service account JSON key in repository secrets."
            exit 1
          fi

          validate_key_json() {
            echo "$1" | jq -e 'type == "object" and has("client_email") and has("private_key")' >/dev/null 2>&1
          }

          normalize_candidate() {
            local v="$1"
            # Trim outer whitespace/newlines and strip accidental wrapping quotes.
            v="$(echo "$v" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//')"
            printf '%s' "$v"
          }

          try_extract_json() {
            local candidate

            candidate="$(normalize_candidate "$1")"
            if validate_key_json "$candidate"; then
              printf '%s' "$candidate"
              return 0
            fi

            # Handle values stored as a JSON string payload.
            local parsed
            parsed="$(printf '%s' "$candidate" | jq -r 'fromjson? // empty' 2>/dev/null || true)"
            if [ -n "$parsed" ] && validate_key_json "$parsed"; then
              printf '%s' "$parsed"
              return 0
            fi

            # Handle JSON pasted as an escaped one-line string with \n and \".
            local unescaped
            unescaped="$(printf '%b' "${candidate//\\n/\n}" 2>/dev/null || true)"
            if [ -n "$unescaped" ] && validate_key_json "$unescaped"; then
              printf '%s' "$unescaped"
              return 0
            fi

            # Handle standard base64 payload.
            local decoded
            decoded="$(printf '%s' "$candidate" | base64 -d 2>/dev/null || true)"
            if [ -n "$decoded" ] && validate_key_json "$decoded"; then
              printf '%s' "$decoded"
              return 0
            fi

            # Handle URL-safe base64 payload.
            local b64url
            b64url="$(printf '%s' "$candidate" | tr '_-' '/+')"
            case $(( ${#b64url} % 4 )) in
              2) b64url="${b64url}==" ;;
              3) b64url="${b64url}=" ;;
            esac
            decoded="$(printf '%s' "$b64url" | base64 -d 2>/dev/null || true)"
            if [ -n "$decoded" ] && validate_key_json "$decoded"; then
              printf '%s' "$decoded"
              return 0
            fi

            return 1
          }

          if ! CREDENTIALS_JSON="$(try_extract_json "$RAW_GCP_SA_KEY")"; then
            echo "GCP_SA_KEY could not be parsed. Supported formats: raw JSON, escaped JSON string, base64 JSON, base64url JSON."
            exit 1
          fi

          echo "::add-mask::$CREDENTIALS_JSON"
          {
            echo "credentials_json<<EOF"
            echo "$CREDENTIALS_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ steps.gcp-key.outputs.credentials_json }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --config=cloudbuild.yaml \
            --substitutions="_IMAGE_TAG=${{ github.sha }}" \
            .

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.eventsslot.com)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: got HTTP $STATUS"
            exit 1
          fi
          echo "Deployment verified: HTTP $STATUS"
