name: Update Docs Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs-site/pages/appendix/changelog.mdx'

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepend changelog entry
        run: |
          DATE=$(date -u +"%B %d, %Y")
          SHA="${{ github.sha }}"
          MSG="${{ github.event.head_commit.message }}"
          ENTRY="## Deploy — $DATE (${SHA:0:7})\n\n> $MSG\n\n---\n\n"
          CONTENT=$(cat docs-site/pages/appendix/changelog.mdx)
          echo -e "$ENTRY$CONTENT" > docs-site/pages/appendix/changelog.mdx

      - name: Commit changelog update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-site/pages/appendix/changelog.mdx
          # Only commit and push if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update changelog on deploy [skip ci]"
            git push origin main
          fi
