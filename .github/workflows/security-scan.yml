name: Security Scan

on:
  push:
    branches:
      - main
  schedule:
    # Run every Monday at 8AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions panel

jobs:

  # ── Filesystem vulnerability scan ───────────────────────────────────
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan on repository
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # ── Dependency vulnerability audit ───────────────────────────────────
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --audit-level=high
        # Fails only on HIGH or CRITICAL vulnerabilities
        # MODERATE vulnerabilities are reported but do not fail the build

      - name: Generate audit report
        if: always()
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30

  # ── Secret scanning ───────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks checks for accidentally committed:
        # - API keys (Paystack, Anthropic, Resend, etc.)
        # - Private keys and certificates
        # - Database connection strings
        # - OAuth secrets

  # ── CodeQL analysis ───────────────────────────────────────────────────
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

  # ── Check for outdated dependencies ──────────────────────────────────
  outdated-check:
    name: Outdated Dependencies Report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    # Only runs on weekly schedule — not on every push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check outdated packages
        run: npm outdated || true
        # This never fails — it just reports what is outdated

      - name: Create issue if outdated packages found
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let outdated;
            try {
              execSync('npm outdated --json');
              outdated = null;
            } catch (e) {
              outdated = JSON.parse(e.stdout.toString());
            }

            if (!outdated || Object.keys(outdated).length === 0) {
              console.log('All packages are up to date.');
              return;
            }

            const lines = Object.entries(outdated).map(([pkg, info]) =>
              `| ${pkg} | ${info.current} | ${info.latest} |`
            );

            const body = [
              '## 📦 Weekly Dependency Update Report',
              '',
              'The following packages have newer versions available:',
              '',
              '| Package | Current | Latest |',
              '|---------|---------|--------|',
              ...lines,
              '',
              'Review and update with `npm update` or check each package for breaking changes.',
            ].join('\n');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📦 Weekly: ${Object.keys(outdated).length} outdated dependencies`,
              body,
              labels: ['dependencies', 'maintenance'],
            });
