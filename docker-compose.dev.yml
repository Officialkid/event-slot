version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: eventslot_app_dev
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - db
    networks:
      - eventslot_network

  db:
    image: postgres:15-alpine
    container_name: eventslot_db_dev
    environment:
      - POSTGRES_DB=eventslot_dev
      - POSTGRES_USER=eventslot_user
      - POSTGRES_PASSWORD=devpassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - eventslot_network

volumes:
  postgres_data_dev:

networks:
  eventslot_network:
    driver: bridge
