<!-- public/favicon.svg -->
<!-- IMPORTANT: Replace this placeholder with the actual EventSlot logo SVG.
     The project currently only contains PNG versions of the logo (public/assets/logo.png).
     Export an SVG from your design tool and replace the content below. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded background matching brand background_color #0a0a0a -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- Calendar body -->
  <rect x="6" y="9" width="20" height="17" rx="2.5" fill="none" stroke="#a3e635" stroke-width="1.8"/>
  <!-- Calendar header bar -->
  <rect x="6" y="9" width="20" height="6" rx="2.5" fill="#a3e635"/>
  <!-- Calendar binding pegs -->
  <line x1="11" y1="6.5" x2="11" y2="11.5" stroke="#a3e635" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="6.5" x2="21" y2="11.5" stroke="#a3e635" stroke-width="2" stroke-linecap="round"/>
  <!-- Checkmark inside calendar body -->
  <polyline points="11,19 14.5,22.5 21,16" fill="none" stroke="#a3e635" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
